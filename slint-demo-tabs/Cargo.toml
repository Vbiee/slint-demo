[package]
name = "slint-demo-tabs"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "=0.61.3", features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole",
    "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common",
    "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
] }
windows-core = "=0.61.2"

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
